<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Convertir tu Word en MD o TXT</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#111a2e;--muted:#66728a;--line:#e6e9f2;--pri:#4f46e5;--pri2:#7c3aed;--acc:#06b6a4;--soft:#eef0ff;--err:#dc2626;--sh:0 1px 2px rgba(17,26,46,.05),0 12px 32px rgba(17,26,46,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f1a;--card:#131a2a;--ink:#eaeefa;--muted:#93a0ba;--line:#243049;--pri:#818cf8;--pri2:#a78bfa;--acc:#2dd4bf;--soft:#1b2340;--err:#f87171;--sh:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0f1a;--card:#131a2a;--ink:#eaeefa;--muted:#93a0ba;--line:#243049;--pri:#818cf8;--pri2:#a78bfa;--acc:#2dd4bf;--soft:#1b2340;--err:#f87171;--sh:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2{font-family:Sora,Inter,sans-serif;margin:0;letter-spacing:-.02em}
.hero{position:relative;overflow:hidden;background:radial-gradient(900px 300px at 85% -20%,rgba(255,255,255,.22),transparent),linear-gradient(120deg,#1e1b4b,var(--pri) 55%,var(--pri2));color:#fff;padding:44px 20px 84px}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,10,40,.7),rgba(20,10,40,.15) 70%,transparent)}
.wrap{max-width:1000px;margin:0 auto;position:relative;z-index:1}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;letter-spacing:.05em;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:5px 12px;border-radius:99px;margin-bottom:14px}
.hero h1{font-size:clamp(26px,5vw,40px);line-height:1.15;max-width:640px}
.hero p{margin:12px 0 0;opacity:.88;max-width:560px;font-size:16px}
main{max-width:1000px;margin:-52px auto 48px;padding:0 16px;position:relative;z-index:2}
.steps{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:var(--sh);margin-bottom:16px;overflow-x:auto;gap:8px}
.step{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.step b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--soft);font-size:12px}
.step.on{color:var(--ink)}.step.on b{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.step.ok b{background:var(--acc);color:#fff}
.sep{flex:1;min-width:16px;height:2px;background:var(--line);border-radius:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--sh)}
.drop{border:2px dashed var(--line);background:var(--bg);border-radius:16px;padding:60px 16px;text-align:center;cursor:pointer;transition:.18s}
.drop:hover,.drop.over{border-color:var(--pri);background:var(--soft)}
.ico{width:64px;height:64px;margin:0 auto 14px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 10px 24px rgba(79,70,229,.35)}
.drop b{display:block;font-family:Sora,sans-serif;font-size:19px}
.drop span{color:var(--muted);font-size:14px}
.chips{display:flex;gap:8px;justify-content:center;margin-top:16px}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.file{display:flex;align-items:center;gap:12px;min-width:0}
.file i{font-style:normal;display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--soft);font-size:20px;flex:none}
.fname{font-weight:600;word-break:break-all}
.meta{color:var(--muted);font-size:13px}
.btn{border:0;border-radius:11px;padding:11px 20px;font:600 14px Inter,sans-serif;cursor:pointer;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.3);transition:.15s}
.btn:hover{transform:translateY(-1px)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.acc{background:linear-gradient(135deg,var(--acc),#0ea5e9);box-shadow:0 6px 16px rgba(6,182,164,.3)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.bar2{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:16px}
.bar2 label{font-size:13px;font-weight:600;color:var(--muted)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px Inter,sans-serif;padding:8px 16px;border-radius:8px;cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.preview{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:22px;background:#fff;color:#1b2335}
.preview img{max-width:100%}.preview table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%}
.preview td,.preview th{border:1px solid #d9deea;padding:5px 9px}
pre.out{margin:0;max-height:460px;overflow:auto;white-space:pre-wrap;word-break:break-word;border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--bg);font:13px/1.6 ui-monospace,Menlo,Consolas,monospace}
.load{text-align:center;padding:56px 16px}
.spin{width:60px;height:60px;border-radius:50%;margin:0 auto 22px;background:conic-gradient(from 0deg,transparent,var(--pri2),var(--pri));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 0);mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 0);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.load h2{font-size:20px;min-height:30px}
.bar{height:6px;background:var(--soft);border-radius:9px;overflow:hidden;max-width:340px;margin:18px auto 12px}
.bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--pri),var(--acc));border-radius:9px;animation:sl 1.5s ease-in-out infinite}
@keyframes sl{0%{margin-left:-40%}100%{margin-left:100%}}
.err{color:var(--err);font-weight:500;margin-top:12px}
.warn{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:12px}
.foot{max-width:1000px;margin:0 auto;padding:8px 16px 32px;text-align:center;color:var(--muted);font-size:13px}
.foot b{color:var(--ink)}
.fbwrap{max-width:1000px;margin:0 auto;padding:0 16px 8px;text-align:center}
.fbwrap p{margin:0 0 10px;color:var(--muted);font-size:14px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,12,24,.62);backdrop-filter:blur(4px);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
.modal{width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.35);position:relative}
.modal h2{font-size:21px;margin-bottom:6px}
.modal .sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.x{position:absolute;top:12px;right:14px;border:0;background:transparent;color:var(--muted);font-size:26px;cursor:pointer;line-height:1}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.fld input,.fld textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:11px;padding:11px 13px;font:15px Inter,sans-serif;outline:none}
.fld input:focus,.fld textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--soft)}
.stars{display:flex;gap:4px}
.stars button{border:0;background:transparent;font-size:36px;line-height:1;cursor:pointer;color:var(--line);padding:0 2px;transition:transform .12s,color .12s}
.stars button:hover{transform:scale(1.15)}
.stars button.on{color:#f5b301;text-shadow:0 2px 10px rgba(245,179,1,.45)}
.hp{position:absolute;left:-9999px;opacity:0}
.okbox{text-align:center;padding:18px 0 6px}.okbox .ico{margin-bottom:10px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/turndown@7.1.2/dist/turndown.js"></script>
<script src="https://cdn.jsdelivr.net/npm/turndown-plugin-gfm@1.0.2/dist/turndown-plugin-gfm.js"></script>
<script>
const { useState, useRef, useEffect } = React;
const html = htm.bind(React.createElement);
const MSGS = ["Leyendo la estructura del documento…","Analizando los datos…","Detectando títulos, listas y tablas…","Detectando patrones…","Convirtiendo línea por línea…","Diseñando las gráficas…","Revisando que no falte información…","Últimos retoques…"];

const FMT = {
  md:{label:"Markdown (.md)",ext:"md",rules:`- Títulos h1-h6 → #, ##, etc. Párrafos → texto normal. Listas con y sin numeración → "-" o "1." respetando la anidación.
- Negrita → **x**, cursiva → *x*, enlaces → [texto](url). Tablas → tablas Markdown (con fila de separación).
- Donde haya una imagen ([IMAGEN]) deja el marcador ![imagen]().
- Responde ÚNICAMENTE con el Markdown final, sin explicaciones ni bloques de código que lo envuelvan.`,target:"Markdown"},
  txt:{label:"Texto plano (.txt)",ext:"txt",rules:`- Texto plano SIN ninguna sintaxis Markdown (nada de #, **, *, backticks ni enlaces con corchetes).
- Títulos: en MAYÚSCULAS en su propia línea, con una línea en blanco antes y después. Párrafos separados por una línea en blanco.
- Listas: con "- " (o "1. " si están numeradas) respetando la sangría. Enlaces: texto (url).
- Tablas: una fila por línea, celdas separadas por " | ".
- Donde haya una imagen ([IMAGEN]) deja [imagen].
- Responde ÚNICAMENTE con el texto final, sin explicaciones.`,target:"texto plano"}
};
const mkPrompt=f=>`Eres un conversor de documentos. Recibes el contenido de un documento Word ya convertido a HTML (conserva títulos, listas, negritas, cursivas, enlaces y tablas). Conviértelo a ${FMT[f].target} recorriendo el documento de principio a fin, línea por línea.
Reglas:
- Conserva TODA la información y el orden original. No resumas, no omitas, no inventes ni reordenes nada.
${FMT[f].rules}

DOCUMENTO:
`;

const AUTOR="Obi-Juan";
const WEB3FORMS_KEY="1273c76e-53f2-4d39-b535-e43d71c6ba5c";
const SVG="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 320' preserveAspectRatio='xMidYMax slice'><defs><linearGradient id='s' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#1b1140'/><stop offset='.55' stop-color='#a23b5c'/><stop offset='.85' stop-color='#f59e4b'/><stop offset='1' stop-color='#fcd581'/></linearGradient><radialGradient id='g'><stop offset='0' stop-color='#fff4c9'/><stop offset='1' stop-color='#fff4c9' stop-opacity='0'/></radialGradient></defs><rect width='1000' height='320' fill='url(#s)'/><g fill='#fff' opacity='.7'><circle cx='90' cy='30' r='1.3'/><circle cx='260' cy='60' r='1'/><circle cx='430' cy='24' r='1.4'/><circle cx='590' cy='70' r='1'/><circle cx='700' cy='28' r='1.2'/><circle cx='900' cy='55' r='1.1'/></g><circle cx='740' cy='215' r='120' fill='url(#g)' opacity='.65'/><circle cx='740' cy='215' r='38' fill='#ffe8a8'/><circle cx='832' cy='238' r='22' fill='#ffb27a'/><path d='M0 250 Q200 200 420 245 T1000 235 V320 H0Z' fill='#b9632f'/><path d='M0 285 Q250 240 520 280 T1000 270 V320 H0Z' fill='#7e3a1e'/><path d='M0 312 Q300 282 600 306 T1000 300 V320 H0Z' fill='#3d1a10'/></svg>";
const HERO_BG={backgroundImage:'url("data:image/svg+xml;utf8,'+encodeURIComponent(SVG)+'")',backgroundSize:'cover',backgroundPosition:'center bottom'};


function toMd(html){
  const doc=new DOMParser().parseFromString(html,"text/html");
  doc.querySelectorAll("table").forEach(t=>{
    if(t.querySelector("th"))return;
    const tr=t.querySelector("tr"); if(!tr)return;
    [...tr.children].forEach(c=>{const th=doc.createElement("th");th.innerHTML=c.innerHTML;c.replaceWith(th);});
    const th=doc.createElement("thead");th.appendChild(tr);t.insertBefore(th,t.firstChild);
  });
  const td=new TurndownService({headingStyle:"atx",bulletListMarker:"-",codeBlockStyle:"fenced",emDelimiter:"*"});
  if(window.turndownPluginGfm)td.use(turndownPluginGfm.gfm);
  return td.turndown(doc.body).replace(/\\\[IMAGEN\\\]/g,"![imagen]()");
}
function inl(n){
  if(n.nodeType===3)return n.nodeValue;
  if(n.nodeType!==1)return "";
  const t=n.tagName.toLowerCase(),c=[...n.childNodes].map(inl).join("");
  if(t==="a"&&n.getAttribute("href")&&c.trim())return c+" ("+n.getAttribute("href")+")";
  if(t==="br")return "\n";
  return c;
}
function lst(el,d){
  const ord=el.tagName==="OL";let i=0;const out=[];
  for(const li of el.children){
    if(li.tagName!=="LI")continue;i++;
    const own=[...li.childNodes].filter(x=>!(x.nodeType===1&&/^(UL|OL)$/.test(x.tagName))).map(inl).join("").trim().replace(/\s+/g," ");
    out.push("  ".repeat(d)+(ord?i+". ":"- ")+own);
    for(const s of li.children)if(/^(UL|OL)$/.test(s.tagName))out.push(lst(s,d+1));
  }
  return out.join("\n");
}
function toTxt(html){
  const doc=new DOMParser().parseFromString(html,"text/html"),out=[];
  for(const el of doc.body.children){
    const t=el.tagName;
    if(/^H[1-6]$/.test(t))out.push(inl(el).trim().toUpperCase());
    else if(t==="UL"||t==="OL")out.push(lst(el,0));
    else if(t==="TABLE")out.push([...el.querySelectorAll("tr")].map(r=>[...r.children].map(c=>inl(c).trim().replace(/\s+/g," ")).join(" | ")).join("\n"));
    else{const x=inl(el).trim();if(x)out.push(x);}
  }
  return out.join("\n\n").replace(/\[IMAGEN\]/g,"[imagen]");
}

function App(){
  const [file,setFile]=useState(null);
  const [prev,setPrev]=useState("");
  const [src,setSrc]=useState("");
  const [phase,setPhase]=useState("upload");
  const [fmt,setFmt]=useState("md");
  const [doneFmt,setDoneFmt]=useState("md");
  const [out,setOut]=useState("");
  const [err,setErr]=useState("");
  const [over,setOver]=useState(false);
  const [mi,setMi]=useState(0);
  const [note,setNote]=useState("");
  const inp=useRef();
  const [fbOpen,setFbOpen]=useState(false);
  const [fbName,setFbName]=useState("");
  const [fbMail,setFbMail]=useState("");
  const [fbRate,setFbRate]=useState(0);
  const [fbHover,setFbHover]=useState(0);
  const [fbMsg,setFbMsg]=useState("");
  const [fbHp,setFbHp]=useState("");
  const [fbSt,setFbSt]=useState("idle");
  const [fbErr,setFbErr]=useState("");
  useEffect(()=>{
    if(!fbOpen)return;
    const k=e=>{if(e.key==="Escape")setFbOpen(false)};
    addEventListener("keydown",k);return()=>removeEventListener("keydown",k);
  },[fbOpen]);

  useEffect(()=>{
    if(phase!=="loading")return;
    const t=setInterval(()=>setMi(i=>(i+1)%MSGS.length),2600);
    return()=>clearInterval(t);
  },[phase]);

  async function load(f){
    setErr("");setNote("");
    if(!f)return;
    if(!/\.docx$/i.test(f.name)){setErr("Sube un archivo Word en formato .docx.");return;}
    try{
      const r=await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()});
      if(!r.value.trim()){setErr("El documento parece estar vacío.");return;}
      setFile(f);setPrev(r.value);
      setSrc(r.value.replace(/<img[^>]*>/g,"[IMAGEN]"));
      setPhase("preview");
    }catch(e){setErr("No se pudo leer el archivo. ¿Es un .docx válido?");}
  }

  async function generate(){
    setErr("");setNote("");setMi(0);setPhase("loading");
    const f=fmt;
    try{
      await new Promise(r=>setTimeout(r,1800));
      const t=(f==="md"?toMd(src):toTxt(src)).trim();
      if(!t)throw {message:"No se encontró contenido para convertir."};
      setOut(t);setDoneFmt(f);setPhase("done");
    }catch(e){
      setErr((e&&e.message)||"Error al convertir el archivo.");
      setPhase("preview");
    }
  }

  const ext=FMT[doneFmt].ext;
  const outName=file?file.name.replace(/\.docx$/i,"")+"."+ext:"documento."+ext;

  function download(){
    const a=document.createElement("a"),u=URL.createObjectURL(new Blob([out],{type:ext==="md"?"text/markdown;charset=utf-8":"text/plain;charset=utf-8"}));
    a.href=u;a.download=outName;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),1000);
  }
  function copy(){navigator.clipboard&&navigator.clipboard.writeText(out).catch(()=>{});}
  function reset(){setFile(null);setPrev("");setSrc("");setOut("");setErr("");setNote("");setPhase("upload");}

  function openFb(){setFbSt("idle");setFbErr("");setFbOpen(true);}
  async function sendFb(){
    setFbErr("");
    if(!fbName.trim())return setFbErr("Ingresá tu nombre.");
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(fbMail.trim()))return setFbErr("Ingresá un mail válido.");
    if(!fbRate)return setFbErr("Elegí cuántas estrellas le das al sitio.");
    if(fbHp)return;
    setFbSt("sending");
    try{
      const r=await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},
        body:JSON.stringify({access_key:WEB3FORMS_KEY,subject:"Nueva opinión sobre Convertir Word a MD/TXT",from_name:"Convertir Word a MD/TXT",name:fbName.trim(),email:fbMail.trim(),estrellas:fbRate+" de 5",message:"Calificación: "+fbRate+" de 5 estrellas\nComentario: "+(fbMsg.trim()||"(sin comentario)"),botcheck:""})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.success)throw new Error(j.message||"error");
      setFbSt("ok");setFbName("");setFbMail("");setFbRate(0);setFbMsg("");
    }catch(e){setFbSt("idle");setFbErr("No se pudo enviar. Probá de nuevo en unos minutos.");}
  }

  const n={upload:1,preview:2,loading:3,done:4}[phase];
  const names=["Subir","Vista previa","Generar","Descargar"];
  return html`<div>
    <div class="hero" style=${HERO_BG}><div class="wrap">
      <h1>Convertir tu Word en MD o TXT</h1>
      <p>Subí tu doc y elegí entre TXT y MD para convertirlo. Así ayudás a Claude a procesarlo.</p>
    </div></div>
    <main>
      <div class="steps">${names.map((s,i)=>html`<${React.Fragment} key=${s}>
        <div class=${"step"+(n===i+1?" on":"")+(n>i+1?" ok":"")}><b>${n>i+1?"✓":i+1}</b>${s}</div>
        ${i<3&&html`<div class="sep"></div>`}<//>`)}</div>

      ${phase==="upload"&&html`<div class="card">
        <div class=${"drop"+(over?" over":"")} onClick=${()=>inp.current.click()}
          onDragOver=${e=>{e.preventDefault();setOver(true)}} onDragLeave=${()=>setOver(false)}
          onDrop=${e=>{e.preventDefault();setOver(false);load(e.dataTransfer.files[0])}}>
          <div class="ico">📄</div><b>Arrastra tu Word aquí</b><span>o haz clic para seleccionarlo</span>
          <div class="chips"><span class="chip">.docx</span><span class="chip">→ .md</span><span class="chip">→ .txt</span></div>
        </div>
        <input ref=${inp} type="file" accept=".docx" hidden onChange=${e=>load(e.target.files[0])}/>
        ${err&&html`<div class="err">${err}</div>`}
      </div>`}

      ${phase==="preview"&&html`<div class="card">
        <div class="row">
          <div class="file"><i>📄</i><div><div class="fname">${file.name}</div><div class="meta">${(file.size/1024).toFixed(1)} KB · vista previa</div></div></div>
          <button class="btn sec" onClick=${reset}>Cambiar archivo</button>
        </div>
        <div class="bar2">
          <label>Convertir a</label>
          <div class="seg">${Object.keys(FMT).map(k=>html`<button key=${k} class=${fmt===k?"on":""} onClick=${()=>setFmt(k)}>${FMT[k].label}</button>`)}</div>
          <div style=${{flex:1}}></div>
          <button class="btn" onClick=${generate}>Generar ${FMT[fmt].ext.toUpperCase()}</button>
        </div>
        <div class="preview" dangerouslySetInnerHTML=${{__html:prev}}></div>
        ${err&&html`<div class="err">${err}</div>`}
      </div>`}

      ${phase==="loading"&&html`<div class="card load">
        <div class="spin"></div>
        <h2 key=${mi}>${MSGS[mi]}</h2>
        <div class="bar"><i></i></div>
        <div class="meta">Convirtiendo tu documento, solo tarda unos segundos.</div>
      </div>`}

      ${phase==="done"&&html`<div class="card">
        <div class="row">
          <div class="file"><i>✅</i><div><div class="fname">${outName}</div><div class="meta">${out.split("\n").length} líneas · ${out.length.toLocaleString("es")} caracteres</div></div></div>
          <div class="btns"><button class="btn sec" onClick=${reset}>Nuevo documento</button><button class="btn sec" onClick=${copy}>Copiar</button><button class="btn acc" onClick=${download}>Descargar .${ext}</button></div>
        </div>
        <pre class="out">${out}</pre>
        ${note&&html`<div class="warn">${note}</div>`}
        ${err&&html`<div class="err">${err}</div>`}
      </div>`}
    </main>
    <div class="fbwrap"><p>¿Qué te pareció el sitio?</p><button class="btn" onClick=${openFb}>⭐ Dejar mi opinión</button></div>
    <footer class="foot">© ${new Date().getFullYear()} <b>Tecnosoftware</b>. Todos los derechos reservados.${AUTOR&&html` · Autor: <b>${AUTOR}</b>`}</footer>
    ${fbOpen&&html`<div class="ov" onClick=${e=>{if(e.target===e.currentTarget)setFbOpen(false)}}><div class="modal" role="dialog" aria-modal="true">
      <button class="x" aria-label="Cerrar" onClick=${()=>setFbOpen(false)}>×</button>
      ${fbSt==="ok"?html`<div class="okbox"><div class="ico">💌</div><h2>¡Mensaje enviado con éxito!</h2><p class="sub">Gracias por dejar tu opinión. La recibimos correctamente.</p><button class="btn" onClick=${()=>setFbOpen(false)}>Cerrar</button></div>`:html`
      <h2>Dejá tu opinión</h2>
      <p class="sub">Contanos qué te pareció el sitio. Tu opinión nos ayuda a mejorarlo.</p>
      <form onSubmit=${e=>{e.preventDefault();sendFb()}}>
        <label class="fld"><span>Nombre</span><input type="text" value=${fbName} onChange=${e=>setFbName(e.target.value)} placeholder="Tu nombre" autocomplete="name"/></label>
        <label class="fld"><span>Mail</span><input type="email" value=${fbMail} onChange=${e=>setFbMail(e.target.value)} placeholder="tu@mail.com" autocomplete="email"/></label>
        <div class="fld"><span>Tu calificación</span>
          <div class="stars" onMouseLeave=${()=>setFbHover(0)}>${[1,2,3,4,5].map(i=>html`<button type="button" key=${i} aria-label=${i+" estrellas"} class=${(fbHover||fbRate)>=i?"on":""} onMouseEnter=${()=>setFbHover(i)} onClick=${()=>setFbRate(i)}>★</button>`)}</div>
        </div>
        <label class="fld"><span>Comentario (opcional)</span><textarea rows="3" value=${fbMsg} onChange=${e=>setFbMsg(e.target.value)} placeholder="¿Qué mejorarías?"></textarea></label>
        <input class="hp" tabindex="-1" autocomplete="off" value=${fbHp} onChange=${e=>setFbHp(e.target.value)} aria-hidden="true"/>
        ${fbErr&&html`<div class="err" style=${{marginTop:0,marginBottom:12}}>${fbErr}</div>`}
        <button class="btn" type="submit" disabled=${fbSt==="sending"} style=${{width:"100%"}}>${fbSt==="sending"?"Enviando…":"Enviar opinión"}</button>
      </form>`}
    </div></div>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
